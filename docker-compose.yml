services:
  neo4j:
    image: neo4j:5.18-community
    container_name: block8-neo4j
    ports:
      - "7474:7474" # Neo4j Browser (web UI)
      - "7687:7687" # Bolt protocol (Python driver)
    environment:
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER} -p ${NEO4J_PASSWORD} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: seeds Neo4j from Block 3's pinned, idempotent load_graph.py,
  # then exits. Re-runs every `docker-compose up` - safe, MERGE-based.
  graph-seed:
    build:
      context: .
      dockerfile: docker/graph-seed.Dockerfile
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - NEO4J_DATABASE=${NEO4J_DATABASE:-neo4j}
    restart: "no"

  rag-service:
    build:
      context: .
      dockerfile: docker/block4.Dockerfile
    container_name: block8-rag-service
    environment:
      - PINECONE_API_KEY=${PINECONE_API_KEY}
      - PINECONE_INDEX_NAME=${PINECONE_INDEX_NAME}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    ports:
      - "8001:8000"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: block8-app
    depends_on:
      - rag-service
      - graph-seed
    environment:
      - RAG_API_URL=http://rag-service:8000
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=${NEO4J_USER}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - NEO4J_DATABASE=${NEO4J_DATABASE:-neo4j}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-true}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-block8-capstone}
    ports:
      - "8000:8000"

volumes:
  neo4j_data:
  neo4j_logs:
